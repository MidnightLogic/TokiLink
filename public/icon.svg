<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Core glow effect for bright elements -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Strong, diffuse glow for atmospheric lighting -->
    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Extra wide ambient glow -->
    <filter id="glow-ambient" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28" result="blur" />
    </filter>

    <!-- 3D Gradient for the main dark button -->
    <radialGradient id="buttonGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2d263b" />
      <stop offset="60%" stop-color="#15121c" />
      <stop offset="100%" stop-color="#0a0810" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#181926" />

  <!-- Ambient background glow behind the ring -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="#7e4ab8" stroke-width="45" filter="url(#glow-ambient)" opacity="0.5" />

  <!-- Scattered Particles & Dust (Pushed out to the corners) -->
  <g id="particles">
    <circle cx="35" cy="40" r="3" fill="#e0b3ff" filter="url(#glow)" opacity="0.8" />
    <rect x="50" y="80" width="4" height="4" fill="#ffffff" filter="url(#glow)" opacity="0.9" />
    <circle cx="80" cy="25" r="1.5" fill="#ffffff" opacity="0.6" />
    
    <circle cx="470" cy="50" r="4" fill="#a259ff" filter="url(#glow-strong)" opacity="0.6" />
    <rect x="420" y="30" width="3" height="3" fill="#ffffff" opacity="0.8" />
    <circle cx="450" cy="80" r="2" fill="#ffffff" filter="url(#glow)" opacity="0.9" />
    
    <circle cx="40" cy="460" r="4" fill="#9d50ff" filter="url(#glow-strong)" opacity="0.5" />
    <rect x="70" y="430" width="4" height="4" fill="#ffffff" filter="url(#glow)" opacity="0.8" />
    <circle cx="25" cy="410" r="1.5" fill="#ffffff" opacity="0.6" />
    
    <circle cx="460" cy="450" r="2" fill="#e0b3ff" filter="url(#glow)" opacity="0.9" />
    <circle cx="420" cy="480" r="4" fill="#9d50ff" filter="url(#glow-strong)" opacity="0.7" />
    <rect x="480" y="420" width="4" height="4" fill="#e0b3ff" filter="url(#glow)" opacity="0.6" />
  </g>

  <!-- Central Dark Button (Rendered BEFORE the ring so it acts as z-index base) -->
  <g id="button">
    <!-- Outer subtle rim for 3D bevel effect, sized to nearly touch the plasma -->
    <circle cx="250" cy="250" r="217" fill="#3a2b4d" />
    <!-- Main button body -->
    <circle cx="250" cy="250" r="215" fill="url(#buttonGradient)" />
  </g>

  <!-- Glowing Plasma Ring (Rendered AFTER button to ensure Z-Index Top, overlapping button edge) -->
  <g id="ring">
    <!-- Outer thick blurred stroke -->
    <circle cx="250" cy="250" r="230" fill="none" stroke="#8c40ff" stroke-width="24" filter="url(#glow-strong)" opacity="0.6" />
    <!-- Medium soft stroke -->
    <circle cx="250" cy="250" r="230" fill="none" stroke="#d5a6ff" stroke-width="10" filter="url(#glow)" opacity="0.8" />
    <!-- Core crisp stroke -->
    <circle cx="250" cy="250" r="230" fill="none" stroke="#ffffff" stroke-width="4" />
    <!-- Sparkle/Granular overlay stroke -->
    <circle cx="250" cy="250" r="230" fill="none" stroke="#ffffff" stroke-width="5" stroke-dasharray="1 16" filter="url(#glow)" opacity="0.9" />
    <!-- Occasional brighter dashes -->
    <circle cx="250" cy="250" r="230" fill="none" stroke="#ffffff" stroke-width="6" stroke-dasharray="8 60" filter="url(#glow-strong)" opacity="1" />
  </g>

  <!-- Enlarged Bluetooth Icon -->
  <g id="bluetooth-icon">
    <!-- Outer soft diffuse glow for the icon -->
    <path 
      d="M 190,310 L 250,250 L 310,190 L 250,130 L 250,370 L 310,310 L 250,250 L 190,190" 
      fill="none" 
      stroke="#b97bff" 
      stroke-width="30" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
      filter="url(#glow-strong)" 
      opacity="0.6" 
    />
    <!-- Inner bright neon glow -->
    <path 
      d="M 190,310 L 250,250 L 310,190 L 250,130 L 250,370 L 310,310 L 250,250 L 190,190" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="20" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
      filter="url(#glow)" 
    />
    <!-- Crisp white core -->
    <path 
      d="M 190,310 L 250,250 L 310,190 L 250,130 L 250,370 L 310,310 L 250,250 L 190,190" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="14" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
  </g>
</svg>
